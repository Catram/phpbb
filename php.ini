; PHP settings for phpBB, on top of the image's defaults.

expose_php = Off
memory_limit = 256M

; Matches client_max_body_size in nginx on the host.
upload_max_filesize = 100M
post_max_size = 100M

; The code never changes inside a running container.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; phpBB's cache ($acm_type = apcu).
apc.shm_size = 64M
