name: Build

on:
  push:
    branches: [main]
  # Weekly, for new phpBB releases and fixes to the PHP image.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/catram/phpbb
  PHPBB_BRANCH: "3.3"

jobs:
  build:
    # GitHub's Ubuntu image comes with Podman.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the current phpBB release
        id: phpbb
        run: |
          version=$(curl -fsSL https://version.phpbb.com/phpbb/versions.json \
            | python3 -c 'import json, os, sys; print(json.load(sys.stdin)["stable"][os.environ["PHPBB_BRANCH"]]["current"])')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.phpbb.outputs.version }}
          TAG: ${{ steps.phpbb.outputs.tag }}
        run: |
          podman build --pull=always \
            --build-arg PHPBB_VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$PHPBB_BRANCH" \
            .

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.phpbb.outputs.tag }}
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman push "$IMAGE:$TAG"
          podman push "$IMAGE:$PHPBB_BRANCH"
          podman logout ghcr.io
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

